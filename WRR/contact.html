<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
    <div id="content">
        <header>
            <a id="logo_link" href="index.html">
                <img class="logo" src="Image/rafting_for_fun_and_pleasure.jpg" alt="Rafting Logo">
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="#">Rivers</a>
                <a href="site-plan-rafting.html">Site Plan</a>
                <a href="contactus.html">Contact Us</a>
            </nav> 
        </header>

        <main>
            <div id="feedback"></div>

            <form action="/my-handling-form-page" method="post">
                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="user_name" placeholder="Your Name" required>
                </p>
                <p>
                    <label for="mail">Email:</label>
                    <input type="email" id="mail" name="user_email" placeholder="your@email.com" required>
                </p>
                <p>
                    <label for="msg">Message:</label>
                    <textarea id="msg" name="user_message" placeholder="Your message here..." required></textarea>
                </p>
                <p>
                    <button type="submit">Send your message</button>
                </p>
            </form>

            <script>
                const feedbackElement = document.getElementById('feedback');
                const formElement = document.querySelector('form');
                
                formElement.addEventListener('submit', function(e) {
                    e.preventDefault();
                    feedbackElement.innerHTML = `Hello ${formElement.user_name.value}! Thank you for your message. We will get back with you as soon as possible!`;
                    feedbackElement.style.display = "block";
                    document.body.classList.add('moveDown');
                    formElement.reset();
                });
            </script>
        </main>

        <footer>
            <p>Dry Oar &copy; 2025 - Kaitlyn Johnson</p>
            <p><a href="site-plan-rafting.html">Site Plan</a></p>
            <p><a href="contactus.html">Contact Us</a></p>
            <div class="social">
                <a href="https://facebook.com">
                    <img src="Image/facebook.png" alt="Facebook">
                </a>
                <a href="https://twitter.com">
                    <img src="Image/twitter.png" alt="Twitter">
                </a>
                <a href="https://instagram.com">
                    <img src="Image/instagram.png" alt="Instagram">
                </a>
            </div>
        </footer>
    </div>
</body>
</html>
